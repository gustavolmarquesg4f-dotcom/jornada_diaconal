name: Testar menu mobile Jornada Diaconal

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/verify-mobile-menu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-menu:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright no ambiente de teste
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verificar gestos e navegação em tamanhos de iPhone
        run: node frontend/tests/mobile-navigation-check.mjs
      - name: Instalar dependências Angular
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar para produção GitHub Pages
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/jornada_diaconal/"
      - name: Testar carregamento do aplicativo real em WebKit e Chromium
        run: node frontend/tests/loading-ux-check.mjs
      - name: Testar planejamento ministerial responsivo e sem acessar dados reais
        run: node frontend/tests/ministry-planning-check.mjs
