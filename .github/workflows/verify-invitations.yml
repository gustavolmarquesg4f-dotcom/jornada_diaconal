name: Validar convites da Jornada Diaconal
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/jornada-convites-api/**'
      - 'supabase/migrations/20261021_jornada_user_invites.sql'
      - 'frontend/**'
      - '.github/workflows/verify-invitations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar função Deno
        run: deno check supabase/functions/jornada-convites-api/index.ts
      - name: Garantir convite sem senha enviada por e-mail
        run: |
          set -euo pipefail
          grep -q 'expires_at:new Date(Date.now()+24\*60\*60\*1000)' supabase/functions/jornada-convites-api/index.ts
          grep -q 'rpc/jdg_complete_user_invite' supabase/functions/jornada-convites-api/index.ts
          grep -q 'must_change_password = false' supabase/migrations/20261021_jornada_user_invites.sql
          grep -q 'REVOKE ALL ON FUNCTION public.jdg_complete_user_invite' supabase/migrations/20261021_jornada_user_invites.sql
          test -f frontend/public/convite-acesso.html
          test -f frontend/public/ativar-acesso.html
      - name: Verificar API implantada sem dados reais
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-convites-api"
          HEALTH=$(curl -fsS --retry 2 --max-time 20 "$API/health")
          echo "$HEALTH" | grep -q '"ok":true'
          STATUS=$(curl -sS -o /tmp/jdg-invites-protected -w "%{http_code}" --max-time 20 "$API/users/pending")
          test "$STATUS" = "401"
          STATUS=$(curl -sS -o /tmp/jdg-invites-create -w "%{http_code}" --max-time 20 \
            -X POST -H "Content-Type: application/json" -d '{"name":"Sem sessão","email":"teste@example.invalid","role":"admin"}' "$API/users/invite")
          test "$STATUS" = "401"
          STATUS=$(curl -sS -o /tmp/jdg-invites-activate -w "%{http_code}" --max-time 20 \
            -X POST -H "Content-Type: application/json" -d '{"token":"invalid","password":"invalid"}' "$API/auth/activate")
          test "$STATUS" = "422"
      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar aplicação Angular
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/jornada_diaconal/"
      - name: Verificar arquivos de ativação no pacote
        run: |
          set -euo pipefail
          DIST="frontend/dist/jornada-diaconal-web/browser"
          test -f "$DIST/index.html"
          test -f "$DIST/convite-acesso.html"
          test -f "$DIST/ativar-acesso.html"
