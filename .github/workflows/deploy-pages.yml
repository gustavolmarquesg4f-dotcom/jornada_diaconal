name: Publicar frontend Angular no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Compilar Angular com caminho do repositório
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/jornada-diaconal-web/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4