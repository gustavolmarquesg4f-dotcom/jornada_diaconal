name: Gerar site Angular na branch gh-pages
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-publish
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Compilar Angular
        run: npx ng build --configuration production --base-href "/jornada_diaconal/"
        working-directory: frontend
      - name: Publicar arquivos compilados na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./frontend/dist/jornada-diaconal-web/browser
          force_orphan: true
          enable_jekyll: false
