name: Validar API Jornada Diaconal
on:
  push:
    paths:
      - ".github/workflows/verify-api.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar saúde da API
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          curl -fsS --retry 3 --retry-delay 3 --max-time 20 "$API/health" | tee /tmp/jd-health.json
          grep -q '"ok":true' /tmp/jd-health.json
      - name: Verificar acesso protegido
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          STATUS=$(curl -sS -o /tmp/jd-protected.json -w "%{http_code}" --max-time 20 "$API/dashboard")
          test "$STATUS" = "401"
      - name: Rotas novas sem autenticação devem ser bloqueadas
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          for ROUTE in "workspace" "reports/monthly?month=2026-10" "readiness" "audit/recent" "deacons/00000000-0000-4000-8000-000000000000/availability"; do
            STATUS=$(curl -sS -o /tmp/jd-protected-route.json -w "%{http_code}" --max-time 20 "$API/$ROUTE")
            test "$STATUS" = "401" || { echo "$ROUTE retornou $STATUS"; exit 1; }
          done
      - name: Bloquear remoção anônima de integrantes
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          STATUS=$(curl -sS -o /tmp/jd-anon-delete.json -w "%{http_code}" --max-time 20 -X DELETE "$API/groups/00000000-0000-4000-8000-000000000000/members/00000000-0000-4000-8000-000000000000")
          test "$STATUS" = "401" || { echo "DELETE anônimo retornou $STATUS"; exit 1; }
      - name: Verificar login inválido e comunicação com o banco
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          STATUS=$(curl -sS -o /tmp/jd-login.json -w "%{http_code}" --max-time 20 -X POST -H "Content-Type: application/json" -H "Origin: https://gustavolmarquesg4f-dotcom.github.io" --data '{"email":"teste.inexistente@exemplo.invalid","password":"teste-incorreto"}' "$API/auth/login")
          test "$STATUS" = "401" || { cat /tmp/jd-login.json; exit 1; }
      - name: Validar CORS do site
        run: |
          set -euo pipefail
          API="https://wscvdtrmplqokceaztrv.supabase.co/functions/v1/jornada-gestao-api"
          curl -fsSI --max-time 20 -X OPTIONS -H "Origin: https://gustavolmarquesg4f-dotcom.github.io" -H "Access-Control-Request-Method: POST" "$API/auth/login" | grep -i 'access-control-allow-origin: https://gustavolmarquesg4f-dotcom.github.io'
