(function () {
  // Links compartilhados podem receber parâmetros de rastreamento.
  // Retira somente utm_*, preservando outros parâmetros e o fragmento da URL.
  try {
    var url = new URL(window.location.href);
    var changed = false;
    Array.from(url.searchParams.keys()).forEach(function (key) {
      if (/^utm_/i.test(key)) {
        url.searchParams.delete(key);
        changed = true;
      }
    });
    if (changed) {
      window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
    }
  } catch (_) {
    // Falhas de histórico do navegador não bloqueiam a aplicação.
  }
})();
